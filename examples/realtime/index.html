<button id="btn-action">Start Detect</button>
<script>
    // Where chord-processor.mjs, chordino.mjs and chordino.wasm live; an app may
    // serve them from a CDN, which addModule and fetch allow with CORS
    const LIB = new URL('../lib/', location.href);
    let stream;
    let workletNode;
    let wasmBinary;
    const btnAction = document.getElementById('btn-action');

    const startAction = async () => {
        if (workletNode) {
            return;
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false }
            });
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);

            // Worklets cannot fetch, so the processor gets the wasm bytes from here
            wasmBinary ??= await (await fetch(new URL('chordino.wasm', LIB))).arrayBuffer();

            // Load the AudioWorklet module
            await audioContext.audioWorklet.addModule(new URL('chord-processor.mjs', LIB));

            // Create the AudioWorkletNode
            workletNode = new AudioWorkletNode(audioContext, 'chord-processor', {
                channelCount: 1,
                channelCountMode: "explicit",
                channelInterpretation: "discrete",
                processorOptions: { wasmBinary }
            });

            // Handle messages from the worklet
            workletNode.port.onmessage = (event) => {
                if (event.data.type === 'chordResult') {
                    console.log('Chords:', event.data.result);
                }
                if (event.data.type === 'ready') {
                    console.log('Listening to microphone...');
                }
                if (event.data.type === 'error') {
                    console.error('Could not load chordino.wasm:', event.data.message);
                }
                if (event.data.type === 'stopped') {
                    console.log('Stopped detecting');
                }
            };

            source.connect(workletNode);
            workletNode.connect(audioContext.destination);
        } catch (err) {
            console.error('Error accessing microphone:', err);
        }
    };

    const stopAction = async () => {
        if (!workletNode) {
            return;
        }
        const _workletNode = workletNode;
        workletNode = undefined;
        stream.getAudioTracks().forEach((track) => {
            track.stop();
        });
        _workletNode.port.postMessage({ type: 'stop' });
        _workletNode.disconnect();
    };

    const onAction = () => {
        if (workletNode) {
            btnAction.textContent = 'Start Detect'
            stopAction();
            return;
        }
        btnAction.textContent = 'Stop Detect';
        startAction();
    }

    btnAction.addEventListener('click', onAction);
</script>
