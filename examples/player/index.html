<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chordino Inspector</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.3);
    --lane-a: #e5e5ea;
    --lane-b: #d1d1d6;
    --plot-empty: #ececf0;
    --playhead: #ff375f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --surface: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
      --accent-soft: rgba(10, 132, 255, 0.45);
      --lane-a: #2c2c2e;
      --lane-b: #3a3a3c;
      --plot-empty: #161618;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 16px;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  h1 { font-size: 18px; margin: 0; }
  .file {
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
  }
  .file input { display: none; }
  #status { color: var(--muted); }
  progress { width: 160px; }
  .controls { margin: 12px 0; }
  audio { width: 100%; max-width: 560px; }
  #toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; border: 0; margin: 0; padding: 0; }
  .now { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; min-height: 64px; margin-bottom: 12px; }
  #chord { font-size: 40px; font-weight: 700; min-width: 3.5em; }
  #time { color: var(--muted); font-variant-numeric: tabular-nums; }
  #candidates {
    display: grid;
    grid-template-columns: auto 120px auto;
    align-items: center;
    gap: 2px 8px;
    margin: 0;
    padding: 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    list-style: none;
  }
  #candidates li { display: contents; }
  #candidates .bar { height: 8px; border-radius: 4px; background: var(--accent); }
  #candidates .pct { color: var(--muted); text-align: right; }
  .panel {
    margin-bottom: 10px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .panel h2 { margin: 0 0 6px; font-size: 13px; }
  .panel h2 small { margin-left: 6px; font-weight: 400; color: var(--muted); }
  canvas { display: block; width: 100%; cursor: pointer; }
  #drop-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px dashed var(--accent);
    background: var(--accent-soft);
    font-size: 24px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <header>
    <h1>Chordino Inspector</h1>
    <label class="file">Choose audio… <input type="file" id="file" accept="audio/*"></label>
    <span id="status">Drop an audio file anywhere on the page.</span>
    <progress id="progress" max="1" hidden></progress>
  </header>
  <div class="controls">
    <audio id="audio" controls></audio>
    <fieldset id="toggles"></fieldset>
    <label>Window
      <select id="window">
        <option value="5">5 s</option>
        <option value="10" selected>10 s</option>
        <option value="20">20 s</option>
        <option value="40">40 s</option>
      </select>
    </label>
  </div>
  <div class="now">
    <div id="chord">–</div>
    <div id="time"></div>
    <ol id="candidates"></ol>
  </div>
  <main id="panels"></main>
  <div id="drop-overlay" hidden>Drop to analyze</div>
  <script type="module" src="./player.js"></script>
</body>
</html>
