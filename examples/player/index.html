<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chordino Inspector</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Chordino Inspector</h1>
    <label class="file">Choose audio / JSON… <input type="file" id="file" accept="audio/*,video/*,.json,application/json" multiple></label>
    <span id="status">Drop an audio file anywhere on the page, and optionally a chord JSON with the expected chords.</span>
    <progress id="progress" max="1" hidden></progress>
    <span class="export">
      <button id="export" disabled title="Detected and expected chords, chord probabilities and chroma, laid out for an AI to analyze">Export for AI</button>
      <select id="export-step" title="Timeline window">
        <option value="0.25">every 0.25 s</option>
        <option value="0.5" selected>every 0.5 s</option>
        <option value="1">every 1 s</option>
      </select>
    </span>
    <span id="expected-file" hidden><span id="expected-name"></span><button id="clear-expected" title="Remove expected chords">×</button></span>
  </header>
  <div class="controls">
    <audio id="audio" controls></audio>
    <fieldset id="toggles"></fieldset>
    <label>Window
      <select id="window">
        <option value="5">5 s</option>
        <option value="10" selected>10 s</option>
        <option value="20">20 s</option>
        <option value="40">40 s</option>
      </select>
    </label>
  </div>
  <div class="now">
    <div>
      <div class="caption">detected</div>
      <div id="chord">–</div>
    </div>
    <div id="expected" hidden>
      <div class="caption">expected</div>
      <div id="expected-chord">–</div>
      <div id="score"></div>
    </div>
    <div id="time"></div>
    <ol id="candidates"></ol>
  </div>
  <main id="panels"></main>
  <div id="drop-overlay" hidden>Drop to analyze</div>
  <script type="module" src="./player.js"></script>
</body>
</html>
